<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not found — Manjunath (Raghav) Chandrashekar</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #050505; --fg: #f1efe9; --mute: #a3a29d; --acc: #ff5e00 }
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body { min-height: 100svh; display: grid; place-content: center; gap: 22px; padding: 16px; text-align: center; background: var(--bg); color: var(--fg); font-family: 'JetBrains Mono', monospace }
    h1 { font: 400 clamp(96px, 24vw, 260px)/.85 Anton, Impact, sans-serif }
    h1 span { color: var(--acc) }
    p { color: var(--mute); font-size: 12px; letter-spacing: .18em; text-transform: uppercase }
    nav { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap }
    a { color: var(--fg); text-decoration: none; border: 1px solid rgba(255,255,255,.35); padding: 12px 18px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase }
    a:hover { border-color: var(--acc); color: var(--acc) }
  </style>
</head>
<body>
  <h1>404<span>/</span></h1>
  <p>The swarm couldn't build this page</p>
  <nav><a href="/">Back to the portfolio →</a><a href="/paper/">Paper mode</a></nav>
</body>
</html>
